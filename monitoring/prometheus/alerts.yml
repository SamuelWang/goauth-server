groups:
  - name: goauth_server
    interval: 30s
    rules:
      # ── Availability ───────────────────────────────────────────────────────

      - alert: GoauthServerDown
        expr: up{job="goauth_server"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Goauth server is down"
          description: "The goauth-server target {{ $labels.instance }} has been unreachable for more than 1 minute."

      # ── Error Rates ────────────────────────────────────────────────────────

      - alert: HighHTTP5xxRate
        expr: |
          sum(rate(goauth_http_requests_total{status_code=~"5.."}[5m]))
            /
          sum(rate(goauth_http_requests_total[5m]))
          > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High HTTP 5xx error rate"
          description: "More than 5% of requests are returning 5xx status codes (current: {{ $value | humanizePercentage }})."

      - alert: HighHTTP4xxRate
        expr: |
          sum(rate(goauth_http_requests_total{status_code=~"4.."}[5m]))
            /
          sum(rate(goauth_http_requests_total[5m]))
          > 0.20
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High HTTP 4xx error rate"
          description: "More than 20% of requests are returning 4xx status codes (current: {{ $value | humanizePercentage }})."

      # ── Latency ────────────────────────────────────────────────────────────

      - alert: HighRequestLatency
        expr: |
          histogram_quantile(0.95,
            sum(rate(goauth_http_request_duration_seconds_bucket[5m])) by (le, path)
          ) > 1.0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High request latency on {{ $labels.path }}"
          description: "The 95th-percentile request latency on {{ $labels.path }} is {{ $value | humanizeDuration }} (threshold: 1s)."

      # ── Rate Limiting ──────────────────────────────────────────────────────

      - alert: HighRateLimitViolations
        expr: |
          sum(rate(goauth_rate_limit_violations_total[5m])) > 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High rate of rate-limit violations"
          description: "More than 10 rate-limit rejections per second over the last 5 minutes (current: {{ $value }}/s). Possible brute-force or DoS attempt."

      # ── Authentication ─────────────────────────────────────────────────────

      - alert: HighAuthFailureRate
        expr: |
          sum(rate(goauth_auth_failures_total[5m])) > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High authentication failure rate"
          description: "More than 5 authentication failures per second over the last 5 minutes (current: {{ $value }}/s)."

      - alert: HighCSRFViolations
        expr: |
          sum(rate(goauth_csrf_violations_total[5m])) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Elevated CSRF violation rate"
          description: "More than 1 CSRF violation per second in the last 5 minutes (current: {{ $value }}/s). Possible cross-site request forgery attempt."

      # ── Database / Process ─────────────────────────────────────────────────

      - alert: HighGoRoutineCount
        expr: go_goroutines{job="goauth_server"} > 1000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High goroutine count"
          description: "The goauth server process has {{ $value }} goroutines (threshold: 1000). Possible goroutine leak."

      - alert: HighMemoryUsage
        expr: |
          process_resident_memory_bytes{job="goauth_server"} > 512 * 1024 * 1024
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage"
          description: "The goauth server is using {{ $value | humanize1024 }}B of resident memory (threshold: 512 MiB)."
