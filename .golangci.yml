version: "2"

run:
  timeout: 5m
  tests: false

linters:
  default: standard

  settings:
    errcheck:
      exclude-functions:
        - (io.Closer).Close

    staticcheck:
      checks: ["all", "-ST1000", "-ST1003", "-ST1005", "-ST1016", "-ST1020", "-ST1021", "-ST1022"]

  exclusions:
    rules:
      # Allow errcheck relaxation in test files
      - path: _test\.go
        linters:
          - errcheck
