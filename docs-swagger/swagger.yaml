host: localhost:8080
info:
  contact:
    name: API Support
  description: |-
    OAuth 2.0 Authorization Code Grant server with client-scoped provider management.

    ## OAuth 2.0 Authorization Code Flow

    ### 1. Discover Enabled Providers
    Fetch the list of OAuth providers enabled for your client:

    GET /api/v1/clients/{client_id}/auth/providers

    Returns provider `name` and `display_name` fields only — no credentials or internal URLs.

    ### 2. Initiate Authorization
    Redirect the user's browser to the login endpoint:

    GET /web/auth/{client_id}/{provider}/login?redirect_uri={your_redirect_uri}&scope={optional_scope}

    The server validates the client and provider, stores a signed session cookie containing
    the CSRF state, and redirects the user to the OAuth provider's authorization page.

    ### 3. Handle Provider Callback
    The OAuth provider redirects the user back to the server's callback endpoint:

    GET /web/auth/{client_id}/{provider}/callback?code=...&state=...

    The server validates the CSRF state, exchanges the provider code for user info,
    creates or updates the user record, issues an authorization code, and redirects to:

    {redirect_uri}?code={authorization_code}

    ### 4. Exchange Code for Access Token
    Your server exchanges the authorization code for a JWT access token:

    POST /api/v1/auth/token
    Content-Type: application/json

    {
    "grant_type":    "authorization_code",
    "code":          "{authorization_code}",
    "client_id":     "{client_uuid}",
    "client_secret": "{client_secret}",
    "redirect_uri":  "{your_redirect_uri}"
    }

    Authorization codes expire after **5 minutes** and are single-use.

    ### 5. Use the Access Token
    Include the JWT in the `Authorization` header for authenticated requests:

    Authorization: Bearer {access_token}

    Tokens are ECDSA-signed JWTs that expire after **60 minutes** (configurable via
    `ACCESS_TOKEN_EXPIRY_MINUTES`). Revoked tokens are rejected at the middleware layer.

    ### 6. Logout
    Revoke the access token server-side and clear the session cookie:

    POST /api/v1/auth/logout
    Authorization: Bearer {access_token}
  license:
    name: GPL-3.0 license
  title: Goauth Server API
  version: 0.3.0
paths:
  /api/v1/auth/change-password:
    post:
      consumes:
      - application/json
      description: |-
        Completes the force-password-change flow. Validates the challenge
        token and the new password, persists the password change, and
        issues a new access token.
      parameters:
      - description: Change password request
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_transport_http_api_v1_handler.ChangePasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_transport_http_api_v1_handler.LoginResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_transport_http_api_v1_handler.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/internal_transport_http_api_v1_handler.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_transport_http_api_v1_handler.ErrorResponse'
      summary: Exchange challenge token for a new password
      tags:
      - Auth
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: Authenticates a user with email + password. Subject to rate limiting
        and account lockout.
      parameters:
      - description: Login credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_transport_http_api_v1_handler.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_transport_http_api_v1_handler.LoginResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_transport_http_api_v1_handler.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_transport_http_api_v1_handler.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/internal_transport_http_api_v1_handler.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_transport_http_api_v1_handler.ErrorResponse'
      summary: Direct login with email and password
      tags:
      - Auth
  /api/v1/auth/logout:
    post:
      description: Revokes the bearer access token and clears the session cookie.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_transport_http_api_v1_handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Logout current user
      tags:
      - Auth
  /api/v1/auth/me:
    get:
      description: Returns profile information for the currently authenticated user.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_transport_http_api_v1_handler.GetCurrentUserResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_transport_http_api_v1_handler.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_transport_http_api_v1_handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get current user
      tags:
      - Auth
  /api/v1/auth/revoke:
    post:
      consumes:
      - application/x-www-form-urlencoded
      description: |-
        Revokes a refresh token or access token. Returns 200 in all cases
        except unauthenticated requests (401). Linked tokens are also revoked.
      parameters:
      - description: HTTP Basic (client) or Bearer (user) auth
        in: header
        name: Authorization
        type: string
      - description: Token value to revoke
        in: formData
        name: token
        required: true
        type: string
      - description: refresh_token or access_token
        in: formData
        name: token_type_hint
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_transport_http_api_v1_handler.ErrorResponse'
      summary: Revoke a token (RFC 7009)
      tags:
      - Auth
  /api/v1/auth/token:
    post:
      consumes:
      - application/json
      description: OAuth 2.0 token endpoint. Supports authorization_code and refresh_token
        grant types.
      parameters:
      - description: Token exchange request
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_transport_http_api_v1_handler.TokenExchangeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_transport_http_api_v1_handler.TokenExchangeResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_transport_http_api_v1_handler.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_transport_http_api_v1_handler.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_transport_http_api_v1_handler.ErrorResponse'
      summary: Exchange authorization code or refresh token for access token
      tags:
      - Auth
  /api/v1/clients:
    get:
      description: Returns a paginated list of client applications. Admin only.
      parameters:
      - default: 20
        description: Items per page (1-100)
        in: query
        name: limit
        type: integer
      - default: 0
        description: Zero-based offset
        in: query
        name: offset
        type: integer
      - description: Filter by active status
        in: query
        name: is_active
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_transport_http_api_v1_handler.ListClientsResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_transport_http_api_v1_handler.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_transport_http_api_v1_handler.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/internal_transport_http_api_v1_handler.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_transport_http_api_v1_handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List clients
      tags:
      - Clients
    post:
      consumes:
      - application/json
      description: Creates a new client application. Returns the client with the plain
        secret (returned once only). Admin only.
      parameters:
      - description: Create client request
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_transport_http_api_v1_handler.CreateClientRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_transport_http_api_v1_handler.ClientWithSecretResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_transport_http_api_v1_handler.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_transport_http_api_v1_handler.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/internal_transport_http_api_v1_handler.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/internal_transport_http_api_v1_handler.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/internal_transport_http_api_v1_handler.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_transport_http_api_v1_handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create a client
      tags:
      - Clients
  /api/v1/clients/{client_id}:
    delete:
      description: Soft-deletes a client (sets is_active = false). Admin only.
      parameters:
      - description: Client UUID
        in: path
        name: client_id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_transport_http_api_v1_handler.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_transport_http_api_v1_handler.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/internal_transport_http_api_v1_handler.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_transport_http_api_v1_handler.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_transport_http_api_v1_handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete a client
      tags:
      - Clients
    get:
      description: Returns a single client application by ID. Admin only.
      parameters:
      - description: Client UUID
        in: path
        name: client_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_transport_http_api_v1_handler.ClientResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_transport_http_api_v1_handler.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_transport_http_api_v1_handler.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/internal_transport_http_api_v1_handler.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_transport_http_api_v1_handler.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_transport_http_api_v1_handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get a client
      tags:
      - Clients
    patch:
      consumes:
      - application/json
      description: Updates a client's configuration. Admin only.
      parameters:
      - description: Client UUID
        in: path
        name: client_id
        required: true
        type: string
      - description: Update client request
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_transport_http_api_v1_handler.UpdateClientRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_transport_http_api_v1_handler.ClientResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_transport_http_api_v1_handler.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_transport_http_api_v1_handler.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/internal_transport_http_api_v1_handler.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_transport_http_api_v1_handler.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/internal_transport_http_api_v1_handler.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/internal_transport_http_api_v1_handler.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_transport_http_api_v1_handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update a client
      tags:
      - Clients
  /api/v1/clients/{client_id}/auth/providers:
    get:
      description: Returns provider names and display names enabled for the specified
        client. No credentials included.
      parameters:
      - description: Client UUID
        in: path
        name: client_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_transport_http_api_v1_handler.ListPublicProvidersResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_transport_http_api_v1_handler.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_transport_http_api_v1_handler.ErrorResponse'
      summary: List enabled providers for a client
      tags:
      - Auth
  /api/v1/clients/{client_id}/providers:
    get:
      description: Returns all OAuth providers configured for the specified client.
        Admin only.
      parameters:
      - description: Client UUID
        in: path
        name: client_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_transport_http_api_v1_handler.ListProvidersResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_transport_http_api_v1_handler.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_transport_http_api_v1_handler.ErrorResponse'
