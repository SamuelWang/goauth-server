# Goauth Server – Kubernetes Secret
#
# WARNING: Do NOT commit actual secret values to version control.
# This manifest shows the required keys; populate the values using:
#
#   kubectl create secret generic goauth-secret \
#     --namespace=goauth \
#     --from-literal=db-password='<value>' \
#     --from-literal=access-token-private-key='<PEM>' \
#     --from-literal=access-token-public-key='<PEM>' \
#     --from-literal=provider-encryption-key='<32-byte hex>' \
#     --from-literal=session-signing-key='<32-byte hex>'
#
# Or use a secrets manager (e.g., External Secrets Operator, Vault Agent).
#
# The keys listed below are placeholders (base64-encoded empty string "").
# Replace each value with: echo -n '<secret>' | base64
apiVersion: v1
kind: Secret
metadata:
  name: goauth-secret
  namespace: goauth
  labels:
    app.kubernetes.io/name: goauth-server
    app.kubernetes.io/component: secrets
type: Opaque
data:
  # Required: replace with real base64-encoded values before deploying
  db-password: ""
  access-token-private-key: ""
  access-token-public-key: ""
  provider-encryption-key: ""
  session-signing-key: ""
