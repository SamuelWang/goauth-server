apiVersion: apps/v1
kind: Deployment
metadata:
  name: goauth-server
  namespace: goauth
  labels:
    app.kubernetes.io/name: goauth-server
    app.kubernetes.io/component: server
    app.kubernetes.io/version: "0.2.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: goauth-server
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: goauth-server
        app.kubernetes.io/component: server
        app.kubernetes.io/version: "0.2.0"
    spec:
      # Run as non-root to match the Dockerfile's appuser
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: server
          image: goauth-server:0.2.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          # Load all non-sensitive config from ConfigMap
          envFrom:
            - configMapRef:
                name: goauth-config
          # Mount sensitive values from Secret individually
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: goauth-secret
                  key: db-password
            - name: ACCESS_TOKEN_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: goauth-secret
                  key: access-token-private-key
            - name: ACCESS_TOKEN_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: goauth-secret
                  key: access-token-public-key
            - name: PROVIDER_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: goauth-secret
                  key: provider-encryption-key
            - name: SESSION_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: goauth-secret
                  key: session-signing-key
          livenessProbe:
            httpGet:
              path: /ops/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ops/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      restartPolicy: Always
