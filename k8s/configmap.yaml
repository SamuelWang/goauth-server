apiVersion: v1
kind: ConfigMap
metadata:
  name: goauth-config
  namespace: goauth
  labels:
    app.kubernetes.io/name: goauth-server
    app.kubernetes.io/component: config
data:
  APP_NAME: "goauth-server"
  VERSION: "0.2.0"
  ENV: "production"
  SCHEME: "https"
  # HOST: override with your actual public hostname in the deploy values or patch
  HOST: "auth.example.com"
  PORT: "8080"
  # Database (non-sensitive)
  DB_HOST: "postgres-service"
  DB_PORT: "5432"
  DB_NAME: "goauth"
  DB_USER: "goauth"
  DB_SSLMODE: "require"
  # Token settings
  ACCESS_TOKEN_EXPIRY_MINUTES: "60"
  # CORS: comma-separated list of allowed origins
  CORS_ALLOWED_ORIGINS: "https://app.example.com"
  # Google OAuth (optional)
  GOOGLE_ENABLED: "false"
  GOOGLE_CLIENT_ID: ""
  GOOGLE_CLIENT_SECRET: ""
